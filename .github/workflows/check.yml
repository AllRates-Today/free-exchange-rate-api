name: Keyless check
on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: ECB pair is served keyless
        run: |
          set -e
          body=$(curl -sf "https://allratestoday.com/api/open/central-bank/ecb?source=USD&target=EUR")
          echo "$body" | head -c 300; echo
          echo "$body" | grep -q '"rate_date"'
      - name: Source list is served keyless
        run: curl -sf "https://allratestoday.com/api/open/central-banks" | grep -q '"code":"ecb"'
      - name: Frankfurter-shape endpoint is served keyless
        run: curl -sf "https://allratestoday.com/api/compat/frankfurter/latest?from=USD&to=EUR" | grep -q '"EUR"'
      - name: ECB dates and ranges are served keyless
        run: |
          set -e
          curl -sf "https://allratestoday.com/api/compat/frankfurter/2026-09-01?from=USD&to=EUR" | grep -q '"EUR"'
          curl -sf "https://allratestoday.com/api/compat/frankfurter/2026-08-01..2026-08-31?from=USD&to=EUR" | grep -q '"start_date"'
